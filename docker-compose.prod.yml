services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blueprint

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - ${PORT}:${PORT}
    environment:
      APP_ENV: ${APP_ENV}
      PORT: ${PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DOUBLE_GIS_API_KEYS: ${DOUBLE_GIS_API_KEYS}
      DOUBLE_GIS_API_KEY: ${DOUBLE_GIS_API_KEY}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      GATEWAY_URL: ${GATEWAY_URL}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      SERVICE_HOST: ${SERVICE_HOST}
      SWAGGER_HOST: ${SWAGGER_HOST}
      SWAGGER_BASE_PATH: ${SWAGGER_BASE_PATH}
      CONFIG_SERVICE_URL: ${CONFIG_SERVICE_URL}
      CONFIG_SERVICE_API_KEY: ${CONFIG_SERVICE_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - blueprint

networks:
  blueprint:
    external: true
